name: "Helm OCI Version Mismatch Build-Info Bug"

on:
  workflow_dispatch:
    inputs:
      jfrog_cli_version:
        description: "JFrog CLI version to test"
        required: false
        default: "2.99.0"

env:
  CHART_NAME: "test-chart"
  CHART_VERSION: "0.23.0"
  DOCKER_BUILD_NUMBER: "0.20.0"
  JFROG_CLI_LOG_LEVEL: "DEBUG"

jobs:
  # ──────────────────────────────────────────────
  # Scenario D: ROOT path + build vars + MATCHING versions (control — should WORK)
  # Chart version == Build number
  # ──────────────────────────────────────────────
  test-version-match:
    name: "Scenario D — Version MATCH (control, should PASS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
        with:
          version: ${{ github.event.inputs.jfrog_cli_version || '2.99.0' }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to Helm OCI registry
        run: |
          OCI_HOST=$(echo "${{ secrets.JF_URL }}" | sed 's|https://||')
          echo "${{ secrets.JF_PASSWORD }}" | helm registry login "${OCI_HOST}" \
            --username "${{ secrets.JF_USER }}" \
            --password-stdin

      - name: Package Helm chart (version 0.23.0)
        run: helm package test-chart --version ${{ env.CHART_VERSION }}

      - name: "Push with BUILD_NUMBER == CHART_VERSION (0.23.0 == 0.23.0)"
        env:
          JFROG_BUILD_NAME: "helm-version-match-build"
          JFROG_BUILD_NUMBER: "${{ env.CHART_VERSION }}"
        run: |
          echo "============================================================"
          echo "Scenario D (control): chart version == build number"
          echo "  Chart version:  ${{ env.CHART_VERSION }}"
          echo "  Build number:   ${{ env.CHART_VERSION }}"
          echo "Expected: PASS — artifact should appear in build-info"
          echo "============================================================"
          OCI_HOST=$(echo "${{ secrets.JF_URL }}" | sed 's|https://||')
          jf helm push \
            ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz \
            oci://${OCI_HOST}/helm-oci-local \
            --debug 2>&1 | tee scenario-d-push.txt
          echo "--- Push exit code: $?"

      - name: Publish build
        env:
          JFROG_BUILD_NAME: "helm-version-match-build"
          JFROG_BUILD_NUMBER: "${{ env.CHART_VERSION }}"
        run: jf rt build-publish 2>&1 | tee scenario-d-publish.txt

      - name: Fetch and inspect build-info
        env:
          JFROG_BUILD_NAME: "helm-version-match-build"
          JFROG_BUILD_NUMBER: "${{ env.CHART_VERSION }}"
        run: |
          jf rt build-info helm-version-match-build ${{ env.CHART_VERSION }} \
            --output-file scenario-d-build-info.json 2>/dev/null \
            || jf rt curl "/api/build/helm-version-match-build/${{ env.CHART_VERSION }}" \
                 > scenario-d-build-info.json

          echo "=== Build-info modules ==="
          cat scenario-d-build-info.json | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          bi = d.get('buildInfo', d)
          modules = bi.get('modules', [])
          print(f'Module count: {len(modules)}')
          for m in modules:
              arts = m.get('artifacts', [])
              print(f'  Module: {m[\"id\"]}  ({len(arts)} artifact(s))')
              for a in arts:
                  print(f'    - {a.get(\"name\")}')
          "

          # Assert helm artifact is present
          if python3 -c "
          import json,sys
          d = json.load(open('scenario-d-build-info.json'))
          bi = d.get('buildInfo', d)
          arts = [a for m in bi.get('modules',[]) for a in m.get('artifacts',[])]
          names = [a.get('name','') for a in arts]
          found = any('${{ env.CHART_NAME }}' in n or 'chart' in n.lower() for n in names)
          sys.exit(0 if found else 1)
          "; then
            echo "PASS: Helm OCI artifact found in build-info"
          else
            echo "::error::FAIL: Helm OCI artifact NOT found in build-info (Scenario D — unexpected failure)"
          fi

      - name: Upload Scenario D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-d-version-match
          path: |
            scenario-d-push.txt
            scenario-d-publish.txt
            scenario-d-build-info.json

  # ──────────────────────────────────────────────
  # Scenario E: ROOT path + build vars + MISMATCHED versions (reproduces new bug)
  # Chart version (0.23.0) != Build number (0.20.0) — matches customer's workflow
  # ──────────────────────────────────────────────
  test-version-mismatch:
    name: "Scenario E — Version MISMATCH (REPRODUCES BUG)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
        with:
          version: ${{ github.event.inputs.jfrog_cli_version || '2.99.0' }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to Helm OCI registry
        run: |
          OCI_HOST=$(echo "${{ secrets.JF_URL }}" | sed 's|https://||')
          echo "${{ secrets.JF_PASSWORD }}" | helm registry login "${OCI_HOST}" \
            --username "${{ secrets.JF_USER }}" \
            --password-stdin

      - name: Package Helm chart (version 0.23.0)
        run: helm package test-chart --version ${{ env.CHART_VERSION }}

      - name: "Push with BUILD_NUMBER != CHART_VERSION (0.20.0 != 0.23.0)"
        env:
          JFROG_BUILD_NAME: "helm-version-mismatch-build"
          JFROG_BUILD_NUMBER: "${{ env.DOCKER_BUILD_NUMBER }}"
        run: |
          echo "============================================================"
          echo "Scenario E (bug): chart version != build number"
          echo "  Chart version:  ${{ env.CHART_VERSION }}"
          echo "  Build number:   ${{ env.DOCKER_BUILD_NUMBER }}"
          echo "Expected: BUG — helm OCI artifact missing from build-info"
          echo "          (CLI uses build number in AQL instead of chart version)"
          echo "============================================================"
          OCI_HOST=$(echo "${{ secrets.JF_URL }}" | sed 's|https://||')
          jf helm push \
            ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz \
            oci://${OCI_HOST}/helm-oci-local \
            --debug 2>&1 | tee scenario-e-push.txt
          echo "--- Push exit code: $?"

          echo ""
          echo "=== Searching debug output for AQL query ==="
          grep -i "aql\|items.find\|path\|repo" scenario-e-push.txt | head -40 || echo "(no AQL lines found)"

      - name: Publish build
        env:
          JFROG_BUILD_NAME: "helm-version-mismatch-build"
          JFROG_BUILD_NUMBER: "${{ env.DOCKER_BUILD_NUMBER }}"
        run: jf rt build-publish 2>&1 | tee scenario-e-publish.txt

      - name: Fetch and inspect build-info
        env:
          JFROG_BUILD_NAME: "helm-version-mismatch-build"
          JFROG_BUILD_NUMBER: "${{ env.DOCKER_BUILD_NUMBER }}"
        run: |
          jf rt build-info helm-version-mismatch-build ${{ env.DOCKER_BUILD_NUMBER }} \
            --output-file scenario-e-build-info.json 2>/dev/null \
            || jf rt curl "/api/build/helm-version-mismatch-build/${{ env.DOCKER_BUILD_NUMBER }}" \
                 > scenario-e-build-info.json

          echo "=== Build-info modules ==="
          cat scenario-e-build-info.json | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          bi = d.get('buildInfo', d)
          modules = bi.get('modules', [])
          print(f'Module count: {len(modules)}')
          for m in modules:
              arts = m.get('artifacts', [])
              print(f'  Module: {m[\"id\"]}  ({len(arts)} artifact(s))')
              for a in arts:
                  print(f'    - {a.get(\"name\")}')
          if not modules:
              print('  (no modules — build-info may be empty)')
          "

          # Check and report bug
          if python3 -c "
          import json,sys
          d = json.load(open('scenario-e-build-info.json'))
          bi = d.get('buildInfo', d)
          arts = [a for m in bi.get('modules',[]) for a in m.get('artifacts',[])]
          names = [a.get('name','') for a in arts]
          found = any('${{ env.CHART_NAME }}' in n or 'chart' in n.lower() for n in names)
          sys.exit(0 if found else 1)
          "; then
            echo "Helm OCI artifact found — bug NOT reproduced with this CLI version"
          else
            echo "::error::BUG REPRODUCED: Helm OCI artifact missing from build-info when chart version != build number"
            echo "Chart version was ${{ env.CHART_VERSION }}, build number was ${{ env.DOCKER_BUILD_NUMBER }}"
          fi

      - name: Upload Scenario E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-e-version-mismatch
          path: |
            scenario-e-push.txt
            scenario-e-publish.txt
            scenario-e-build-info.json

  # ──────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────
  summarize:
    name: "Test Summary"
    runs-on: ubuntu-latest
    needs: [test-version-match, test-version-mismatch]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "# Helm OCI Version Mismatch Build-Info Bug — Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scenario | Chart Version | Build Number | Expected | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------------|--------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| D (control) | 0.23.0 | 0.23.0 | PASS | ${{ needs.test-version-match.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E (bug) | 0.23.0 | 0.20.0 | FAIL (artifact missing) | ${{ needs.test-version-mismatch.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Hypothesis" >> $GITHUB_STEP_SUMMARY
          echo "When \`jf helm push\` runs with build env vars set, the CLI performs an AQL query" >> $GITHUB_STEP_SUMMARY
          echo "to locate the pushed OCI artifact for build-info association." >> $GITHUB_STEP_SUMMARY
          echo "The AQL likely uses \`JFROG_BUILD_NUMBER\` as the version component in the path," >> $GITHUB_STEP_SUMMARY
          echo "rather than reading the actual chart version from the pushed \`.tgz\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**When they match:** AQL finds the artifact → recorded in build-info ✓" >> $GITHUB_STEP_SUMMARY
          echo "**When they differ:** AQL finds nothing → silently skipped → artifact missing from build-info ✗" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CLI Version Tested" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.inputs.jfrog_cli_version || '2.99.0' }}" >> $GITHUB_STEP_SUMMARY
