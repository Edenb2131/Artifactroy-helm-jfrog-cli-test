name: "Helm OCI Nested Path Bug Test"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jfrog_cli_version:
        description: "JFrog CLI version to test (e.g. 2.99.0)"
        required: false
        default: "2.99.0"

env:
  HELM_REPO: "helm-local"
  CHART_NAME: "test-chart"
  CHART_VERSION: "0.1.0"

jobs:
  # ──────────────────────────────────────────────
  # Scenario A: ROOT path (expected to WORK)
  # oci://<host>/helm-local
  # ──────────────────────────────────────────────
  test-root-path:
    name: "Scenario A — Root path (should PASS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
        with:
          version: ${{ github.event.inputs.jfrog_cli_version || '2.99.0' }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: helm package test-chart --version ${{ env.CHART_VERSION }}

      - name: "Push to ROOT of repo (no subdirectory)"
        env:
          JFROG_BUILD_NAME: "helm-root-path-build"
          JFROG_BUILD_NUMBER: "${{ github.run_number }}"
        run: |
          echo "============================================================"
          echo "Scenario A: Pushing to ROOT of OCI repo (no nested path)"
          echo "Expected: SUCCESS — CLI should correctly resolve repo name"
          echo "============================================================"
          OCI_HOST=$(echo "${{ secrets.JF_URL }}" | sed 's|https://||')
          jf helm push \
            ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz \
            oci://${OCI_HOST}/helm-local \
            --debug 2>&1 | tee scenario-a-output.txt
          echo "Exit code: $?"

      - name: Upload Scenario A logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-a-root-path-logs
          path: scenario-a-output.txt

  # ──────────────────────────────────────────────
  # Scenario B: NESTED path (expected to FAIL with 404)
  # oci://<host>/helm-local/subdir1/subdir2
  # ──────────────────────────────────────────────
  test-nested-path:
    name: "Scenario B — Nested path (REPRODUCES BUG)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
        with:
          version: ${{ github.event.inputs.jfrog_cli_version || '2.99.0' }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: helm package test-chart --version ${{ env.CHART_VERSION }}

      - name: "Push to NESTED path with build vars"
        env:
          JFROG_BUILD_NAME: "helm-nested-path-build"
          JFROG_BUILD_NUMBER: "${{ github.run_number }}"
        run: |
          echo "============================================================"
          echo "Scenario B: Pushing to NESTED OCI path (subdirectories)"
          echo "Expected: FAIL — CLI incorrectly uses 'subdir1' as repo name"
          echo "           and truncates path in AQL query -> 404 on build props"
          echo "============================================================"
          OCI_HOST=$(echo "${{ secrets.JF_URL }}" | sed 's|https://||')
          jf helm push \
            ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz \
            oci://${OCI_HOST}/helm-local/subdir1/subdir2 \
            --debug 2>&1 | tee scenario-b-output.txt
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          if grep -q "404" scenario-b-output.txt; then
            echo "BUG CONFIRMED: 404 error detected in nested path scenario"
            echo "::error::BUG REPRODUCED — 404 on nested OCI path with build association"
          fi
          exit $EXIT_CODE

      - name: Upload Scenario B logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-b-nested-path-logs
          path: scenario-b-output.txt

  # ──────────────────────────────────────────────
  # Scenario C: NESTED path WITHOUT build vars (expected to WORK)
  # Confirms the bug is ONLY triggered by build association
  # ──────────────────────────────────────────────
  test-nested-no-build:
    name: "Scenario C — Nested path, no build vars (should PASS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
        with:
          version: ${{ github.event.inputs.jfrog_cli_version || '2.99.0' }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: helm package test-chart --version ${{ env.CHART_VERSION }}

      - name: "Push to nested path WITHOUT build env vars"
        run: |
          echo "============================================================"
          echo "Scenario C: Nested path, NO JFROG_BUILD_NAME/NUMBER set"
          echo "Expected: SUCCESS — bug only triggers when build vars present"
          echo "============================================================"
          OCI_HOST=$(echo "${{ secrets.JF_URL }}" | sed 's|https://||')
          unset JFROG_BUILD_NAME
          unset JFROG_BUILD_NUMBER
          jf helm push \
            ${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz \
            oci://${OCI_HOST}/helm-local/subdir1/subdir2 \
            --debug 2>&1 | tee scenario-c-output.txt
          echo "Exit code: $?"

      - name: Upload Scenario C logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-c-nested-no-build-logs
          path: scenario-c-output.txt

  # ──────────────────────────────────────────────
  # Summary job — collects results
  # ──────────────────────────────────────────────
  summarize:
    name: "Test Summary"
    runs-on: ubuntu-latest
    needs: [test-root-path, test-nested-path, test-nested-no-build]
    if: always()
    steps:
      - name: Download all logs
        uses: actions/download-artifact@v4

      - name: Print summary
        run: |
          echo "# Helm OCI Nested Path AQL Bug — Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scenario | Description | Expected | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| A | Root path + build vars | PASS | ${{ needs.test-root-path.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| B | Nested path + build vars | FAIL (404) | ${{ needs.test-nested-path.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C | Nested path, no build vars | PASS | ${{ needs.test-nested-no-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Details" >> $GITHUB_STEP_SUMMARY
          echo "- **CLI Version:** ${{ github.event.inputs.jfrog_cli_version || '2.99.0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Root cause:** JFrog CLI parses OCI URL by splitting on host, taking the first path segment as repo name." >> $GITHUB_STEP_SUMMARY
          echo "- When URL is \`oci://host/REPO/subdir1/subdir2\`, CLI uses \`subdir1\` (wrong) instead of \`REPO\`." >> $GITHUB_STEP_SUMMARY
          echo "- AQL path also truncates subdirectory components, producing the wrong artifact path." >> $GITHUB_STEP_SUMMARY
          echo "- The 404 occurs when CLI tries to assign build properties to the (non-existent) resolved path." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -rl "404" scenario-b-nested-path-logs/ 2>/dev/null | grep -q .; then
            echo "**BUG STATUS: CONFIRMED — 404 error reproduced in Scenario B**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## AQL Comparison" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "INCORRECT (nested path):" >> $GITHUB_STEP_SUMMARY
          echo '  items.find({"repo": "subdir1", "path": "test-chart/0.1.0"})' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CORRECT (expected):" >> $GITHUB_STEP_SUMMARY
          echo '  items.find({"repo": "helm-local", "path": "subdir1/subdir2/test-chart/0.1.0"})' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
